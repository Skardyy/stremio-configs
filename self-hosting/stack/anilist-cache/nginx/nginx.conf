# AniList caching proxy.

worker_processes 1;

events {
    worker_connections 256;
}

http {
    log_format cache '$upstream_cache_status $upstream_status $upstream_addr';
    access_log /dev/stdout cache;
    error_log /dev/stderr warn;

    # keys_zone is the only RAM cost: 10m indexes roughly 80k entries.
    # max_size caps disk; nginx evicts least-recently-used beyond it.
    # inactive drops anything untouched for 30 days.
    proxy_cache_path /var/cache/nginx/anilist
        levels=1:2
        keys_zone=anilist:10m
        max_size=200m
        inactive=30d
        use_temp_path=off;

    # AniList speaks GraphQL over TLS and needs SNI plus a resolver, since the
    # upstream address is a variable rather than a static upstream block.
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

    server {
        # TLS, because the addon container is told graphql.anilist.co resolves
        # here and will speak HTTPS to it. The cert is signed by the private CA
        # that only that container trusts.
        listen 443 ssl;
        http2 on;
        server_name graphql.anilist.co;

        ssl_certificate     /etc/nginx/certs/server.pem;
        ssl_certificate_key /etc/nginx/certs/server-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:1m;

        # A GraphQL POST body can be sizeable; it must be buffered in full
        # before it can be used as a cache key.
        client_max_body_size 2m;
        client_body_buffer_size 2m;

        location @anilist_empty {
            add_header Content-Type application/json always;
            return 200 '{"data":{"Page":{"pageInfo":{"hasNextPage":false},"media":[]}}}';
        }

        location / {
            proxy_pass https://graphql.anilist.co;
            proxy_ssl_server_name on;
            proxy_ssl_name graphql.anilist.co;
            proxy_set_header Host graphql.anilist.co;

            # Every query hits the same path, so the body is the only thing
            # telling a trending query apart from a seasonal one.
            proxy_cache anilist;
            proxy_cache_methods POST;
            proxy_cache_key "$request_method$request_uri$request_body";

            proxy_cache_valid 200 6h;

            # updating: serve stale while a refresh is already in flight,
            # rather than queueing behind it.
            # http_403: AniList's own outage response.
            proxy_cache_use_stale updating error timeout
                                  http_403 http_429
                                  http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;

            # One upstream request per key when several miss at once.
            proxy_cache_lock on;
            proxy_cache_lock_timeout 10s;

            # AniList sends no-store headers; without this nothing would cache.
            proxy_ignore_headers Cache-Control Expires Set-Cookie;

            # Visible in curl -I, so a cache HIT/STALE/MISS can be confirmed.
            add_header X-Cache-Status $upstream_cache_status always;

            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;

            # The cache key embeds the POST body, which overflows the 4k default.
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;

            # AniList's 403 becomes PERMANENT_ERROR (30 min) upstream, because
            # classifyResult reads error.status while httpClient sets
            # error.response.status - so no HTTP code is ever classified. A 200
            # with an empty payload sidesteps the error path entirely: the
            # addon's isExternalApi emptiness check lands it in EMPTY_RESULT
            # (60s) and never caches it as a success.
            proxy_intercept_errors on;
            error_page 403 = @anilist_empty;
        }

    }

    # Plain HTTP, purely so the container healthcheck does not have to trust
    # the private CA.
    server {
        listen 8080;
        server_name _;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }
}

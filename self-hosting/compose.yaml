services:
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
      - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
      - "--entryPoints.websecure.address=:443"
      # DNS-01 instead of HTTP-01: required when Cloudflare proxies (orange
      # cloud), since Let's Encrypt can't reach the origin directly. Also
      # allows a wildcard cert.
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL?}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/config/acme.json"
      # Trust Cloudflare's forwarded client IPs so logs and rate limits see
      # the real visitor rather than the edge.
      - "--entryPoints.websecure.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22"
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN?}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik:/config
    mem_limit: 128m

  aiostreams:
    image: ghcr.io/viren070/aiostreams:latest
    container_name: aiostreams
    restart: unless-stopped
    env_file: [.env]
    environment:
      - BASE_URL=https://${AIOSTREAMS_HOST?}
      - SECRET_KEY=${SECRET_KEY?}
      - BUILTIN_DEBRID_ERROR_CACHE_TTL=0
    volumes:
      - ./data/aiostreams:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.aiostreams.loadbalancer.server.port=3000"

      # Gated: the configure UI and dashboard. Higher priority so it wins.
      # Note manifests live under the SAME /stremio prefix as the configure
      # page (/stremio/{uuid}/manifest.json vs /stremio/configure), so this
      # has to name the exact paths rather than allowlist a prefix.
      - "traefik.http.routers.aiostreams-cfg.rule=Host(`${AIOSTREAMS_HOST?}`) && (PathPrefix(`/stremio/configure`) || PathPrefix(`/dashboard`) || PathPrefix(`/configure`))"
      - "traefik.http.routers.aiostreams-cfg.priority=100"
      - "traefik.http.routers.aiostreams-cfg.entrypoints=websecure"
      - "traefik.http.routers.aiostreams-cfg.tls.certresolver=letsencrypt"
      - "traefik.http.routers.aiostreams-cfg.service=aiostreams"
      - "traefik.http.routers.aiostreams-cfg.middlewares=stack-auth"

      # Everything else: manifests, streams, catalogs, static assets. Must
      # stay open for Nuvio/Stremio.
      - "traefik.http.routers.aiostreams.rule=Host(`${AIOSTREAMS_HOST?}`)"
      - "traefik.http.routers.aiostreams.priority=1"
      - "traefik.http.routers.aiostreams.entrypoints=websecure"
      - "traefik.http.routers.aiostreams.tls.certresolver=letsencrypt"
      - "traefik.http.routers.aiostreams.service=aiostreams"
    mem_limit: 700m

  aiometadata:
    image: ghcr.io/cedya77/aiometadata:latest
    container_name: aiometadata
    restart: unless-stopped
    init: true
    tty: true
    env_file: [.env]
    environment:
      - HOST_NAME=https://${AIOMETADATA_HOST?}
      - REDIS_URL=redis://aiometadata_redis:6379
      - DATABASE_URI=sqlite://addon/data/db.sqlite
    volumes:
      - ./data/aiometadata/data:/app/addon/data
    depends_on:
      aiometadata_redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.aiometadata.loadbalancer.server.port=3232"

      # Public: the endpoints Nuvio/Stremio must reach without credentials.
      # Higher priority so these win over the catch-all router below.
      - "traefik.http.routers.aiometadata-pub.rule=Host(`${AIOMETADATA_HOST?}`) && (PathPrefix(`/stremio`) || PathPrefix(`/poster`) || PathPrefix(`/resize-image`) || PathPrefix(`/api/image`) || PathPrefix(`/api/cache/health`))"
      - "traefik.http.routers.aiometadata-pub.priority=100"
      - "traefik.http.routers.aiometadata-pub.entrypoints=websecure"
      - "traefik.http.routers.aiometadata-pub.tls.certresolver=letsencrypt"
      - "traefik.http.routers.aiometadata-pub.service=aiometadata"

      # Everything else (/, /configure, /api/config/*, /dashboard) needs the
      # master password. AIOMetadata has no instance-level gate of its own.
      - "traefik.http.routers.aiometadata.rule=Host(`${AIOMETADATA_HOST?}`)"
      - "traefik.http.routers.aiometadata.priority=1"
      - "traefik.http.routers.aiometadata.entrypoints=websecure"
      - "traefik.http.routers.aiometadata.tls.certresolver=letsencrypt"
      - "traefik.http.routers.aiometadata.service=aiometadata"
      - "traefik.http.routers.aiometadata.middlewares=stack-auth"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3232/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: 700m

  aiometadata_redis:
    image: redis:7-alpine
    container_name: aiometadata_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 320m

  # Exposes only the Docker API endpoints Dozzle needs
  docker-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - INFO=1
      - PING=1
      - VERSION=1
      - EVENTS=1
      - POST=1
      - EXEC=1
      - ALLOW_LOGS=1
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=1
      # deny
      - IMAGES=0
      - VOLUMES=0
      - NETWORKS=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - NODES=0
      - PLUGINS=0
      - SECRETS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
    mem_limit: 64m

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    environment:
      - DOZZLE_NO_ANALYTICS=true
      - DOZZLE_ENABLE_ACTIONS=true
      - DOZZLE_ENABLE_SHELL=true
      # via the proxy, not the raw socket
      - DOZZLE_REMOTE_HOST=tcp://docker-socket-proxy:2375|local
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`${DOZZLE_HOST?}`)"
      - "traefik.http.routers.dozzle.entrypoints=websecure"
      - "traefik.http.routers.dozzle.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dozzle.middlewares=stack-auth"
      - "traefik.http.middlewares.stack-auth.basicauth.users=${AIOSTREAMS_BASICAUTH?}"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
    mem_limit: 128m
